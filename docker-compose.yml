services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgresdemo
      POSTGRES_USER: postgres
      # Demo-only password. Never reuse it outside this lab.
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgresdemo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: src/PostgresDemo
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresDb: Host=postgres;Port=5432;Database=postgresdemo;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
